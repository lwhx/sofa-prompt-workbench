name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装 Python
        run: uv python install 3.12
      - name: 安装后端依赖
        run: uv sync --locked --extra dev
      - name: 运行后端代码检查
        run: uv run ruff check app tests
      - name: 运行后端测试
        run: uv run pytest

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        run: npm ci
      - name: 运行代码检查
        run: npm run lint
      - name: 运行类型检查
        run: npm run typecheck
      - name: 运行单元测试
        run: npm test -- --run
      - name: 构建前端
        run: npm run build

  e2e:
    name: E2E 测试
    needs: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: 安装前端依赖
        run: npm ci --prefix ../frontend
      - name: 安装 E2E 依赖
        run: npm ci
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 运行 E2E 测试
        run: npm test
