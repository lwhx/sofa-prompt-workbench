[project]
name = "sofa-prompt-workbench-backend"
version = "1.0.0"
description = "沙发场景提示词工作台后端"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=45,<47",
  "fastapi>=0.116,<1",
  "filetype>=1.2,<2",
  "httpcore>=1,<2",
  "httpx>=0.28,<1",
  "pillow>=11,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "rq>=2.4,<3",
  "sqlalchemy>=2.0.41,<3",
  "sse-starlette>=2.3,<4",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.30,<3",
  "mypy>=1.16,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/api/v1/admin.py" = ["E501", "F401", "I001"]
"app/api/v1/auth.py" = ["E501"]
"app/services/dispatcher.py" = ["E501", "SIM105"]
"app/services/worker.py" = ["I001"]
"tests/integration/test_admin.py" = ["I001"]
"tests/integration/test_migrations.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["fakeredis.*", "rq.*", "filetype.*"]
ignore_missing_imports = true
